[build]
  command = "pnpm run build:netlify"
  publish = "netlify-dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.13.0"

[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
